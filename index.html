<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 반 냉장고를 부탁해</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root{
    --bg:#F7F3EC; --panel:#FFFFFF; --panel-2:#F1EBDD;
    --ink:#2A2620; --ink-soft:#7A756C;
    --accent:#E8382A; --accent-ink:#FFFFFF;
    --gold:#B8862E; --teal:#1E8F76; --steel:#8B8577; --line:#E4DFD2;
    --shadow: 0 12px 28px -14px rgba(0,0,0,.18);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); }
  body{
    font-family:'Noto Sans KR',sans-serif;
    padding-inline:20px; padding-block:26px;
    display:flex; flex-direction:column; gap:22px;
    max-width:640px; margin-inline:auto;
    min-height:100dvh;
    position:relative;
    background:
      radial-gradient(60% 45% at 18% 0%, rgba(232,56,42,.08), transparent 60%),
      var(--bg);
  }
  body > *{ position:relative; z-index:1; }

  header{ display:flex; flex-direction:column; gap:8px; }
  .badge{
    display:inline-flex; align-self:flex-start; align-items:center; gap:6px;
    background:transparent; color:var(--steel); font-family:'Noto Sans KR',sans-serif;
    font-size:11.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
    padding:4px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  }
  h1{
    font-family:'Gothic A1',sans-serif; font-weight:900;
    font-size:clamp(28px,7.5vw,40px); margin:0; line-height:1.15; letter-spacing:-.01em;
  }
  h1 .cut{ position:relative; display:inline-block; color:var(--ink); }
  h1 .cut::after{
    content:''; position:absolute; left:-4%; right:-4%; bottom:6%; height:38%;
    background:var(--accent); z-index:-1; transform:skewX(-10deg);
  }
  .tagline{
    font-size:13px; font-weight:700; color:var(--accent); letter-spacing:.03em;
    font-style:italic;
  }
  .sub{ color:var(--ink-soft); font-size:14px; line-height:1.65; }

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:18px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px;
    position:relative;
  }
  .panel::before{
    content:attr(data-mission); position:absolute; top:-10px; left:16px;
    background:var(--bg); color:var(--steel); font-family:'Gothic A1',sans-serif; font-weight:900;
    font-size:11px; padding:2px 10px; border:1px solid var(--line); letter-spacing:.08em;
  }
  .panel h2{
    font-size:16px; margin:6px 0 0; color:var(--ink); font-weight:900; font-family:'Gothic A1',sans-serif;
    display:flex; align-items:center; gap:8px;
  }

  canvas{
    width:100%; aspect-ratio:4/3; border-radius:6px; background:#EDEAE2;
    border:1px solid var(--line); touch-action:none; cursor:crosshair; display:block;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.3);
  }
  .toolrow{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .swatches{ display:flex; gap:6px; }
  .swatch{
    width:24px; height:24px; border-radius:50%; border:2px solid var(--panel);
    outline:1px solid var(--line); cursor:pointer; padding:0;
  }
  .swatch[aria-pressed="true"]{ outline:2px solid var(--accent); }
  .colorpicker-label{
    width:26px; height:26px; border-radius:50%; overflow:hidden; display:inline-block;
    border:1px solid var(--line); cursor:pointer; position:relative;
  }
  .colorpicker-label input[type="color"]{
    position:absolute; inset:-4px; width:calc(100% + 8px); height:calc(100% + 8px);
    border:none; padding:0; cursor:pointer;
  }
  input[type="range"]{ accent-color:var(--accent); width:84px; }
  .ghostbtn,.primarybtn{
    font-family:'Noto Sans KR',sans-serif; border-radius:4px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--ink); font-size:13px; padding:7px 14px;
    cursor:pointer; font-weight:500;
  }
  .primarybtn{
    font-family:'Gothic A1',sans-serif;
    background:var(--accent); color:var(--accent-ink); border:1px solid #8f1108;
    font-weight:900; padding:16px 20px; font-size:17px; width:100%; letter-spacing:.02em;
    box-shadow:0 14px 26px -10px rgba(232,56,42,.55);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 3% 100%);
  }
  .primarybtn:disabled{ opacity:.5; cursor:not-allowed; box-shadow:none; }
  label{ font-size:12.5px; font-weight:700; color:var(--ink-soft); display:block; margin-bottom:5px; }
  input[type="text"], textarea{
    width:100%; font-family:'Noto Sans KR',sans-serif; font-size:15px; padding:10px 12px;
    border-radius:5px; border:1px solid var(--line); background:var(--bg); color:var(--ink);
  }
  input[type="text"]::placeholder, textarea::placeholder{ color:#565A61; }
  textarea{ resize:vertical; min-height:54px; line-height:1.5; }
  .field{ margin-bottom:0; }

  .status{
    text-align:center; font-size:13px; color:var(--ink-soft); min-height:18px;
  }
  .status.ok{ color:var(--teal); font-weight:700; }
  .status.err{ color:var(--accent); font-weight:700; }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(120%);
    background:var(--ink); color:var(--bg); padding:12px 20px; border-radius:4px;
    font-family:'Gothic A1',sans-serif; font-weight:900; font-size:14px; box-shadow:var(--shadow);
    transition:transform .3s ease; z-index:10; border-left:4px solid var(--accent);
  }
  .toast.show{ transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <header>
    <div class="badge">Class Cooking Survival · 30분 완성</div>
    <h1>우리 반 <span class="cut">냉장고</span>를 부탁해</h1>
    <p class="tagline">오직 맛으로, 완성한다</p>
    <p class="sub">냉장고 속엔 한식 재료와 세계 여러 나라의 문화가 뒤섞여 있어요. 이 재료들로 세상에 없던 K-퓨전 메뉴를 완성해서 오늘의 냉장고 결과 발표에 올려보세요.</p>
  </header>

  <section class="panel" data-mission="MISSION 01">
    <h2>냉장고 속 재료 그리기</h2>
    <canvas id="canvas"></canvas>
    <div class="toolrow">
      <div class="swatches" id="swatches"></div>
      <label class="colorpicker-label" title="원하는 색 직접 고르기">
        <input type="color" id="customColor" value="#e8382a">
      </label>
      <label style="margin:0; display:flex; align-items:center; gap:6px; font-weight:400;">굵기
        <input type="range" id="size" min="2" max="22" value="6">
      </label>
      <button class="ghostbtn" id="eraseBtn" type="button">지우개</button>
      <button class="ghostbtn" id="undoBtn" type="button">되돌리기</button>
      <button class="ghostbtn" id="clearBtn" type="button">전체 지우기</button>
    </div>
  </section>

  <section class="panel" data-mission="MISSION 02">
    <h2>오늘의 메뉴판 작성</h2>
    <div class="field">
      <label for="author">셰프 이름(또는 모둠명)</label>
      <input type="text" id="author" placeholder="예: 2모둠 김민준" maxlength="30">
    </div>
    <div class="field">
      <label for="menuName">메뉴 이름</label>
      <input type="text" id="menuName" placeholder="예: 불고기 케밥" maxlength="40">
    </div>
    <div class="field">
      <label for="korean">어떤 한식을 넣었나요?</label>
      <input type="text" id="korean" placeholder="예: 불고기" maxlength="30">
    </div>
    <div class="field">
      <label for="culture">어떤 나라 문화와 섞었나요?</label>
      <input type="text" id="culture" placeholder="예: 터키" maxlength="30">
    </div>
    <div class="field">
      <label for="desc">한 줄 소개</label>
      <textarea id="desc" maxlength="140" placeholder="예: 달콤짭짤한 불고기를 화덕에 구워 얇은 빵에 채소와 함께 싸먹는 메뉴예요."></textarea>
    </div>
    <div class="field">
      <label for="country">어떤 나라 사람들 입맛을 고려했나요?</label>
      <input type="text" id="country" placeholder="예: 향신료보다 달콤한 맛을 좋아하는 입맛" maxlength="60">
    </div>
  </section>

  <button class="primarybtn" id="submitBtn" type="button">완성, 제출한다</button>
  <div class="status" id="statusLine"></div>

  <div class="toast" id="toast">완성 — 결과 발표 화면을 확인하세요</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import {
      getFirestore, collection, addDoc, serverTimestamp,
      onSnapshot, query
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const submissionsRef = collection(db, "submissions");

    const CONFIG_LOOKS_UNSET = !firebaseConfig.apiKey || firebaseConfig.apiKey.includes('YOUR_')
      || !firebaseConfig.projectId || firebaseConfig.projectId.includes('YOUR_');

    function withTimeout(promise, ms, label){
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject({ code: 'timeout', message: label }), ms)),
      ]);
    }

    // ---------- drawing ----------
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let drawing = false, currentStroke = null;
    let strokes = [];
    let currentColor = '#E8382A';
    let eraseMode = false;
    const COLORS = [
      '#15171B', '#FFFFFF', '#E8382A', '#E87A2A', '#D8B979', '#D8CE5C',
      '#5FA35F', '#3FB89A', '#3F6FBF', '#5F7FE0', '#8F5FC0', '#C05F8F'
    ];

    function bg(){ return getComputedStyle(canvas).backgroundColor || '#EDEAE2'; }

    function sizeCanvas(){
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      ctx.setTransform(dpr,0,0,dpr,0,0);
      redraw();
    }

    function redraw(){
      const rect = canvas.getBoundingClientRect();
      ctx.save();
      ctx.setTransform(window.devicePixelRatio||1,0,0,window.devicePixelRatio||1,0,0);
      ctx.clearRect(0,0,rect.width,rect.height);
      ctx.fillStyle = bg();
      ctx.fillRect(0,0,rect.width,rect.height);
      strokes.forEach(s=>{
        if (s.points.length < 2) return;
        ctx.beginPath();
        ctx.lineJoin='round'; ctx.lineCap='round';
        ctx.lineWidth = s.size;
        ctx.strokeStyle = s.erase ? bg() : s.color;
        ctx.moveTo(s.points[0].x, s.points[0].y);
        for (let i=1;i<s.points.length;i++) ctx.lineTo(s.points[i].x, s.points[i].y);
        ctx.stroke();
      });
      ctx.restore();
    }

    function getPos(e){
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }
    function startDraw(e){
      e.preventDefault(); drawing = true;
      const p = getPos(e);
      currentStroke = { points:[p], color: currentColor, size: parseInt(sizeInput.value,10), erase: eraseMode };
      strokes.push(currentStroke); redraw();
    }
    function moveDraw(e){
      if (!drawing) return; e.preventDefault();
      currentStroke.points.push(getPos(e)); redraw();
    }
    function endDraw(){ drawing=false; currentStroke=null; }

    canvas.addEventListener('pointerdown', startDraw);
    canvas.addEventListener('pointermove', moveDraw);
    window.addEventListener('pointerup', endDraw);
    canvas.addEventListener('touchstart', startDraw, {passive:false});
    canvas.addEventListener('touchmove', moveDraw, {passive:false});
    canvas.addEventListener('touchend', endDraw);

    const swatchesEl = document.getElementById('swatches');
    COLORS.forEach((c,i)=>{
      const b = document.createElement('button');
      b.type='button'; b.className='swatch'; b.style.background=c;
      b.setAttribute('aria-pressed', i===2 ? 'true':'false');
      b.addEventListener('click', ()=>{
        currentColor=c; eraseMode=false; eraseBtn.setAttribute('aria-pressed','false');
        eraseBtn.style.background=''; eraseBtn.style.color='';
        [...swatchesEl.children].forEach(el=>el.setAttribute('aria-pressed', el===b?'true':'false'));
      });
      swatchesEl.appendChild(b);
    });

    const customColorInput = document.getElementById('customColor');
    customColorInput.addEventListener('input', ()=>{
      currentColor = customColorInput.value;
      eraseMode = false;
      eraseBtn.setAttribute('aria-pressed','false');
      eraseBtn.style.background=''; eraseBtn.style.color='';
      [...swatchesEl.children].forEach(el=>el.setAttribute('aria-pressed','false'));
    });

    const sizeInput = document.getElementById('size');
    const eraseBtn = document.getElementById('eraseBtn');
    eraseBtn.addEventListener('click', ()=>{
      eraseMode = !eraseMode;
      eraseBtn.setAttribute('aria-pressed', eraseMode ? 'true':'false');
      eraseBtn.style.background = eraseMode ? 'var(--accent)' : '';
      eraseBtn.style.color = eraseMode ? 'var(--accent-ink)' : '';
    });
    document.getElementById('undoBtn').addEventListener('click', ()=>{ strokes.pop(); redraw(); });
    document.getElementById('clearBtn').addEventListener('click', ()=>{ strokes = []; redraw(); });
    window.addEventListener('resize', sizeCanvas);
    requestAnimationFrame(sizeCanvas);

    // 화면은 고해상도로 그리되, 업로드는 작은 사본으로 변환해서 속도를 크게 줄인다.
    function exportSmallImage(maxWidth){
      const rect = canvas.getBoundingClientRect();
      const scale = Math.min(1, maxWidth / rect.width);
      const outW = Math.round(rect.width * scale);
      const outH = Math.round(rect.height * scale);
      const off = document.createElement('canvas');
      off.width = outW; off.height = outH;
      const octx = off.getContext('2d');
      octx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, outW, outH);
      try { return off.toDataURL('image/jpeg', 0.6); } catch(e){ return ''; }
    }

    // ---------- submit ----------
    const authorEl = document.getElementById('author');
    const menuNameEl = document.getElementById('menuName');
    const koreanEl = document.getElementById('korean');
    const cultureEl = document.getElementById('culture');
    const descEl = document.getElementById('desc');
    const countryEl = document.getElementById('country');
    const submitBtn = document.getElementById('submitBtn');
    const statusLine = document.getElementById('statusLine');
    const toast = document.getElementById('toast');

    function showToast(){
      toast.classList.add('show');
      setTimeout(()=>toast.classList.remove('show'), 2600);
    }

    submitBtn.addEventListener('click', async ()=>{
      if (!authorEl.value.trim()){
        statusLine.textContent = '셰프 이름(또는 모둠명)을 먼저 적어주세요.';
        statusLine.className = 'status err';
        authorEl.focus();
        return;
      }
      if (strokes.length === 0 && !menuNameEl.value.trim()){
        statusLine.textContent = '그림을 그리거나 메뉴 이름을 먼저 적어주세요.';
        statusLine.className = 'status err';
        menuNameEl.focus();
        return;
      }
      if (CONFIG_LOOKS_UNSET){
        statusLine.textContent = 'firebase-config.js에 아직 실제 값이 없어요. Firebase 콘솔에서 복사한 설정을 넣어주세요.';
        statusLine.className = 'status err';
        return;
      }

      submitBtn.disabled = true;
      statusLine.textContent = '냉장고에 담는 중...';
      statusLine.className = 'status';

      const dataUrl = exportSmallImage(480);

      try {
        await withTimeout(
          addDoc(submissionsRef, {
            author: authorEl.value.trim(),
            name: menuNameEl.value.trim(),
            korean: koreanEl.value.trim(),
            culture: cultureEl.value.trim(),
            desc: descEl.value.trim(),
            country: countryEl.value.trim(),
            image: dataUrl,
            createdAt: serverTimestamp(),
          }),
          8000,
          '8초 안에 응답이 없어요. Firebase 설정(config 값, Firestore 규칙)이나 네트워크를 확인해주세요.'
        );
        statusLine.textContent = '완성!';
        statusLine.className = 'status ok';
        showToast();
        strokes = []; redraw();
        menuNameEl.value=''; koreanEl.value=''; cultureEl.value=''; descEl.value=''; countryEl.value='';
        // 이름은 같은 학생이 이어서 제출할 수 있으니 지우지 않고 남겨둠
        menuNameEl.focus();
      } catch(err){
        console.error(err);
        const detail = err.code === 'timeout' ? err.message : (err.message || err.code || 'error');
        statusLine.textContent = '제출에 실패했어요: ' + detail;
        statusLine.className = 'status err';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
