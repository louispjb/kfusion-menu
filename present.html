<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 반 냉장고를 부탁해 · 결과 발표</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root{
    --bg:#F7F3EC; --panel:#FFFFFF; --panel-2:#F1EBDD;
    --ink:#2A2620; --ink-soft:#7A756C;
    --accent:#E8382A; --accent-ink:#FFFFFF;
    --gold:#B8862E; --teal:#1E8F76; --steel:#8B8577; --line:#E4DFD2;
    --shadow: 0 12px 28px -14px rgba(0,0,0,.18);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); }
  body{
    font-family:'Noto Sans KR',sans-serif;
    padding-inline:28px; padding-block:26px;
    display:flex; flex-direction:column; gap:22px;
    max-width:1280px; margin-inline:auto; min-height:100dvh;
    position:relative;
    background:
      radial-gradient(45% 40% at 12% 0%, rgba(232,56,42,.07), transparent 60%),
      var(--bg);
  }
  body > *{ position:relative; z-index:1; }

  .topbar{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap; }
  .badge{
    display:inline-flex; align-self:flex-start; align-items:center; gap:6px;
    color:var(--steel); font-size:11.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
    padding:4px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    margin-bottom:8px;
  }
  h1{
    font-family:'Gothic A1',sans-serif; font-weight:900;
    font-size:clamp(26px,3.8vw,38px); margin:0; letter-spacing:-.01em;
  }
  h1 .cut{ position:relative; display:inline-block; color:var(--ink); }
  h1 .cut::after{
    content:''; position:absolute; left:-4%; right:-4%; bottom:6%; height:34%;
    background:var(--accent); z-index:-1; transform:skewX(-10deg);
  }

  .joinbox{
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 18px;
    display:flex; align-items:center; gap:14px; box-shadow:var(--shadow);
  }
  .joinbox img{ width:84px; height:84px; border-radius:6px; background:#fff; padding:4px; }
  .joinbox .urlrow{ display:flex; gap:8px; align-items:center; }
  .joinbox input{
    font-family:monospace; font-size:13px; padding:8px 10px; border-radius:5px;
    border:1px solid var(--line); background:var(--bg); color:var(--ink); width:220px;
  }
  .joinbox button{
    border:1px solid var(--line); background:var(--panel-2); color:var(--ink); border-radius:5px; padding:8px 12px;
    font-family:inherit; font-size:13px; cursor:pointer;
  }
  .joinbox .label{ font-size:12px; color:var(--ink-soft); font-weight:700; margin-bottom:4px; }

  .galleryhead{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .count{ color:var(--ink); font-family:'Gothic A1',sans-serif; font-weight:900; font-size:16px; }
  .count .n{ color:var(--accent); }
  .resetbtn{
    border:1px solid var(--line); background:var(--panel); color:var(--accent); font-weight:700;
    border-radius:4px; padding:8px 16px; font-size:13px; cursor:pointer; font-family:inherit;
  }

  .gallery{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:16px; }
  .empty{
    grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:16px;
    border:1px dashed var(--line); border-radius:10px;
  }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden;
    box-shadow:var(--shadow); cursor:pointer; display:flex; flex-direction:column; animation:pop .3s ease;
   
  }
  @keyframes pop{ from{opacity:0; transform:scale(.94);} to{opacity:1; transform:scale(1);} }

  /* ---------- plate reveal: 돔(뚜껑)이 들어올려지며 접시 위 그림이 뿅 튀어나옴 ---------- */
  .dish{
    position:relative; width:100%; aspect-ratio:4/3; overflow:hidden;
    background:radial-gradient(ellipse at 50% 62%, #EDE7D8, #DCD3BE 72%);
    display:flex; align-items:center; justify-content:center;
  }
  .plate{
    position:relative; width:70%; aspect-ratio:1/1; border-radius:50%; overflow:hidden;
    box-shadow:
      0 26px 40px -14px rgba(0,0,0,.7),
      0 0 0 7px #e9e9eb,
      0 0 0 9px #c7c8cb,
      0 0 0 10px rgba(0,0,0,.25);
    transform:scale(.4) translateY(10px); opacity:0;
  }
  .plate .dishimg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .dish[data-revealed="true"] .plate{ transform:scale(1) translateY(0); opacity:1; }
  .dish.opening .plate{ animation: platePop .65s cubic-bezier(.32,1.7,.55,1) .28s forwards; }
  @keyframes platePop{
    0%{ transform:scale(.35) translateY(16px); opacity:0; }
    55%{ transform:scale(1.14) translateY(-8px); opacity:1; }
    78%{ transform:scale(.94) translateY(2px); }
    100%{ transform:scale(1) translateY(0); opacity:1; }
  }

  .dome{
    position:absolute; left:50%; top:50%; z-index:5;
    width:76%; aspect-ratio:1/0.62; transform:translate(-50%,-58%);
    border-radius:50% 50% 8% 8% / 100% 100% 12% 12%;
    background:
      radial-gradient(ellipse at 32% 18%, rgba(255,255,255,.9), rgba(255,255,255,0) 40%),
      linear-gradient(160deg, #f3f4f5 0%, #cacccf 26%, #8d8f93 54%, #55575b 78%, #302f31 100%);
    box-shadow:0 16px 28px -10px rgba(0,0,0,.75), inset 0 -8px 12px rgba(0,0,0,.3);
  }
  .dome::after{
    content:''; position:absolute; top:-10px; left:50%; transform:translateX(-50%);
    width:18px; height:18px; border-radius:50%;
    background:linear-gradient(160deg,#f3f4f5,#8d8f93); box-shadow:0 3px 7px rgba(0,0,0,.55);
  }
  .dish.opening .dome{ animation: domeLift .5s cubic-bezier(.5,0,.35,1) forwards; }
  @keyframes domeLift{
    to{ transform:translate(-28%,-210%) rotate(-20deg) scale(.7); opacity:0; }
  }
  .dish[data-revealed="true"] .dome{ display:none; }

  .stamp{
    position:absolute; top:9px; right:9px; z-index:6;
    width:44px; height:44px; border-radius:50%;
    background:var(--accent); color:#fff; font-family:'Gothic A1',sans-serif; font-weight:900;
    font-size:12px; display:flex; align-items:center; justify-content:center; text-align:center;
    border:2px solid rgba(255,255,255,.85); box-shadow:0 4px 14px rgba(0,0,0,.5);
    transform:rotate(-14deg) scale(0);
  }
  .dish[data-revealed="true"] .stamp{ transform:rotate(-14deg) scale(1); }
  .dish.opening .stamp{ animation: stampIn .3s cubic-bezier(.4,1.8,.6,1) .68s forwards; }
  @keyframes stampIn{ to{ transform:rotate(-14deg) scale(1); } }

  .card .cardbody{ padding:10px 12px 12px; display:flex; flex-direction:column; gap:5px; }
  .author{ font-size:11.5px; font-weight:700; color:var(--gold); letter-spacing:.02em; }
  .card .name{ font-family:'Gothic A1',sans-serif; font-weight:900; font-size:19px; line-height:1.2; color:var(--ink); }
  .card .tags{ display:flex; gap:5px; flex-wrap:wrap; }
  .tag{ font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:3px; background:var(--panel-2); color:var(--ink-soft); }
  .tag.teal{ background:color-mix(in srgb, var(--teal) 22%, var(--panel-2)); color:var(--teal); }
  .card .desc{ font-size:12.5px; color:var(--ink-soft); line-height:1.45; }

  #present{
    position:fixed; inset:0; background:rgba(2,2,3,.92); display:none;
    align-items:center; justify-content:center; padding:24px; z-index:50;
  }
  #present.open{ display:flex; }
  .presentcard{
    background:var(--panel); border-radius:12px; max-width:820px; width:100%; max-height:92vh;
    overflow:auto; box-shadow:0 40px 80px -20px rgba(0,0,0,.35); display:flex; flex-direction:column;
    border:1px solid var(--line);
  }
  .presentcard img{ width:100%; aspect-ratio:4/3; object-fit:cover; }
  .presentbody{ padding:24px 28px 28px; display:flex; flex-direction:column; gap:10px; }
  .presentbody .name{ font-family:'Gothic A1',sans-serif; font-weight:900; font-size:32px; color:var(--ink); line-height:1.15; }
  .presentbody .desc{ font-size:16px; line-height:1.6; color:var(--ink); }
  .presentnav{
    position:absolute; top:50%; transform:translateY(-50%); background:var(--panel); border:1px solid var(--line);
    width:48px; height:48px; border-radius:50%; font-size:20px; cursor:pointer; box-shadow:var(--shadow); color:var(--ink);
  }
  #prevBtn{ left:16px; } #nextBtn{ right:16px; }
  #closePresent{
    position:absolute; top:20px; right:20px; background:var(--panel); border:1px solid var(--line); width:38px; height:38px;
    border-radius:50%; cursor:pointer; font-size:17px; box-shadow:var(--shadow); color:var(--ink); z-index:2;
  }
  .presentindex{ font-size:13px; color:var(--ink-soft); }
</style>
</head>
<body>
  <div class="topbar">
    <div>
      <div class="badge">Result Reveal</div>
      <h1>우리 반 <span class="cut">냉장고</span>를 부탁해</h1>
    </div>
    <div class="joinbox">
      <img id="qrImg" alt="접속 QR코드">
      <div>
        <div class="label">학생 접속 주소 (한 번만 입력하면 저장돼요)</div>
        <div class="urlrow">
          <input type="text" id="siteUrl" placeholder="예: https://내사이트주소.web.app/">
          <button id="saveUrlBtn" type="button">저장</button>
        </div>
      </div>
    </div>
  </div>

  <div class="galleryhead">
    <span class="count" id="countLabel">0개 완성</span>
    <button class="resetbtn" id="resetAllBtn" type="button">전체 삭제</button>
  </div>

  <div class="gallery" id="gallery">
    <div class="empty">학생들이 완성하면 여기에 실시간으로 나타나요.</div>
  </div>

  <div id="present">
    <button id="closePresent" type="button" aria-label="닫기">✕</button>
    <button class="presentnav" id="prevBtn" type="button" aria-label="이전">‹</button>
    <div class="presentcard" id="presentCard"></div>
    <button class="presentnav" id="nextBtn" type="button" aria-label="다음">›</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import {
      getFirestore, collection, onSnapshot, query, orderBy, deleteDoc, doc, getDocs
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const submissionsRef = collection(db, "submissions");

    const CONFIG_LOOKS_UNSET = !firebaseConfig.apiKey || firebaseConfig.apiKey.includes('YOUR_')
      || !firebaseConfig.projectId || firebaseConfig.projectId.includes('YOUR_');
    if (CONFIG_LOOKS_UNSET){
      document.getElementById('gallery').innerHTML =
        '<div class="empty">firebase-config.js에 아직 실제 값이 없어요. Firebase 콘솔에서 복사한 설정을 넣어주세요.</div>';
    }

    // ---------- QR / join box ----------
    const siteUrlInput = document.getElementById('siteUrl');
    const qrImg = document.getElementById('qrImg');
    const saved = localStorage.getItem('kfusion_site_url') || '';
    if (saved) siteUrlInput.value = saved;
    function updateQr(){
      const url = siteUrlInput.value.trim();
      if (!url){ qrImg.removeAttribute('src'); return; }
      qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(url);
    }
    document.getElementById('saveUrlBtn').addEventListener('click', ()=>{
      localStorage.setItem('kfusion_site_url', siteUrlInput.value.trim());
      updateQr();
    });
    updateQr();

    // ---------- gallery ----------
    const galleryEl = document.getElementById('gallery');
    const countLabel = document.getElementById('countLabel');
    let entries = [];
    const revealedIds = new Set(); // 한 번 열어본 냉장고는 이 세션 동안 계속 열려있음

    function escapeHtml(str){
      return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function renderGallery(){
      countLabel.textContent = entries.length + '개 완성';
      if (entries.length === 0){
        galleryEl.innerHTML = '<div class="empty">학생들이 완성하면 여기에 실시간으로 나타나요.</div>';
        return;
      }
      galleryEl.innerHTML = '';
      entries.forEach((en, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        const revealed = revealedIds.has(en.id);
        card.innerHTML =
          '<div class="dish"' + (revealed ? ' data-revealed="true"' : '') + '>' +
            '<div class="stamp">완성</div>' +
            (revealed ? '' : '<div class="dome"></div>') +
            '<div class="plate"><img class="dishimg" src="' + en.image + '" alt="' + escapeHtml(en.name) + '"></div>' +
          '</div>' +
          '<div class="cardbody">' +
            (en.author ? '<div class="author">' + escapeHtml(en.author) + '</div>' : '') +
            '<div class="name">' + escapeHtml(en.name || '이름 없는 메뉴') + '</div>' +
            '<div class="tags">' +
              (en.korean ? '<span class="tag">' + escapeHtml(en.korean) + '</span>' : '') +
              (en.culture ? '<span class="tag teal">' + escapeHtml(en.culture) + '</span>' : '') +
            '</div>' +
            '<div class="desc">' + escapeHtml(en.desc || '') + '</div>' +
          '</div>';

        card.addEventListener('click', () => openPresent(idx));
        galleryEl.appendChild(card);
      });
    }

    if (!CONFIG_LOOKS_UNSET){
      const q = query(submissionsRef, orderBy('createdAt', 'asc'));
      onSnapshot(q, (snap) => {
        entries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderGallery();
      }, (err) => {
        console.error(err);
        galleryEl.innerHTML = '<div class="empty">연결에 문제가 있어요: ' + err.code + '</div>';
      });
    }

    document.getElementById('resetAllBtn').addEventListener('click', async () => {
      if (!confirm('완성된 모든 요리를 삭제할까요? 되돌릴 수 없어요.')) return;
      const snap = await getDocs(submissionsRef);
      await Promise.all(snap.docs.map(d => deleteDoc(doc(db, 'submissions', d.id))));
    });

    // ---------- present mode ----------
    const present = document.getElementById('present');
    const presentCard = document.getElementById('presentCard');
    let currentPresentIdx = 0;

    function renderPresent(){
      const en = entries[currentPresentIdx];
      if (!en){ closePresent(); return; }
      const revealed = revealedIds.has(en.id);
      presentCard.innerHTML =
        '<div class="dish"' + (revealed ? ' data-revealed="true"' : '') + '>' +
          '<div class="stamp">완성</div>' +
          (revealed ? '' : '<div class="dome"></div>') +
          '<div class="plate"><img class="dishimg" src="' + en.image + '" alt="' + escapeHtml(en.name) + '"></div>' +
        '</div>' +
        '<div class="presentbody"' + (revealed ? '' : ' style="opacity:0"') + '>' +
          (en.author ? '<div class="author">' + escapeHtml(en.author) + '</div>' : '') +
          '<div class="name">' + escapeHtml(en.name || '이름 없는 메뉴') + '</div>' +
          '<div class="tags">' +
            (en.korean ? '<span class="tag">' + escapeHtml(en.korean) + '</span>' : '') +
            (en.culture ? '<span class="tag teal">' + escapeHtml(en.culture) + '</span>' : '') +
          '</div>' +
          '<div class="desc">' + escapeHtml(en.desc || '') + '</div>' +
          (en.country ? '<div class="desc"><strong>고려한 입맛:</strong> ' + escapeHtml(en.country) + '</div>' : '') +
          '<div class="presentindex">' + (currentPresentIdx+1) + ' / ' + entries.length + '</div>' +
        '</div>';

      if (!revealed){
        const dishEl = presentCard.querySelector('.dish');
        const bodyEl = presentCard.querySelector('.presentbody');
        // 다음 프레임에 opening을 붙여서 애니메이션이 확실히 재생되게 함
        requestAnimationFrame(() => {
          dishEl.classList.add('opening');
        });
        setTimeout(() => {
          revealedIds.add(en.id);
          // data-revealed="true"가 붙는 순간 CSS에서 돔을 display:none 처리하므로,
          // 'opening' 클래스는 그대로 둬도(제거해도) 다시 닫히는 문제가 없음
          dishEl.setAttribute('data-revealed', 'true');
          bodyEl.style.transition = 'opacity .35s ease';
          bodyEl.style.opacity = '1';
          renderGallery();
        }, 1000);
      }
    }
    function openPresent(idx){ currentPresentIdx = idx; renderPresent(); present.classList.add('open'); }
    function closePresent(){ present.classList.remove('open'); }

    document.getElementById('closePresent').addEventListener('click', closePresent);
    document.getElementById('prevBtn').addEventListener('click', () => {
      currentPresentIdx = (currentPresentIdx - 1 + entries.length) % entries.length; renderPresent();
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      currentPresentIdx = (currentPresentIdx + 1) % entries.length; renderPresent();
    });
    present.addEventListener('click', (e) => { if (e.target === present) closePresent(); });
    document.addEventListener('keydown', (e) => {
      if (!present.classList.contains('open')) return;
      if (e.key === 'Escape') closePresent();
      if (e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
      if (e.key === 'ArrowRight') document.getElementById('nextBtn').click();
    });
  </script>
</body>
</html>
